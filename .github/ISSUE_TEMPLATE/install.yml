name: Install problem
description: The desktop app does not download, install or start.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **No diagnostics needed**: the app may not have started at all. Tell us where it stopped and what the message said.

        Many warnings have a way through: see [Install](https://github.com/Fei2411/DS-Bot#install) in the README.
  - type: dropdown
    id: step
    attributes:
      label: Where did it stop?
      options:
        - Download
        - Browser warning
        - SmartScreen or Smart App Control
        - Installer
        - First start
        - Other
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The message, or a photo of it
      description: Copy the text of the dialog, or paste a screenshot or a phone photo (Ctrl+V or drag it in).
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type winver and press Enter. On macOS or Linux, write the system and its version.
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: System language
      description: The display language of Windows, macOS or Linux.
      placeholder: 简体中文 / English
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File you downloaded
      placeholder: DS-Bot-0.2.2-win-x64.exe
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: For example the antivirus you use, or what you already tried.
  - type: checkboxes
    id: clean
    attributes:
      label: Privacy
      options:
        - label: This report has no API keys, tokens or personal data.
          required: true
